version: "3.9"

services:
  db:
    image: postgres:15
    container_name: blog_db
    restart: always
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: blog_backend
    restart: always
    depends_on:
      - db
    environment:
      SECRET_KEY: django-production-secret
      DEBUG: "0"
      DB_NAME: blogdb
      DB_USER: bloguser
      DB_PASSWORD: blogpass
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: blog_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://http://62.60.191.176:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
