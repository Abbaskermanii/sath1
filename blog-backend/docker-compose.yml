services:
  db:
    image: postgres:16
    container_name: blog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: blog_redis
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: blog_minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: .
    container_name: blog_backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
    environment:
      SECRET_KEY: django-production-secret
      DEBUG: "0"

      NERKH_API_TOKEN: 2jhh99VgC54y-09ZKDiUWaH2H_EyvSv7puwOVu7o830=

      DB_NAME: blogdb
      DB_USER: bloguser
      DB_PASSWORD: blogpass
      DB_HOST: db
      DB_PORT: "5432"

      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_STORAGE_BUCKET_NAME: media
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_CUSTOM_DOMAIN: shakhes1.ir/media

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    ports:
      - "8000:8000"

    command: >
      gunicorn config.wsgi:application
       --bind 0.0.0.0:8000
       --log-level debug
       --access-logfile -
       --error-logfile -

  celery_worker:
    build: .
    container_name: blog_celery_worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
    environment:
      SECRET_KEY: django-production-secret
      DEBUG: "0"

      NERKH_API_TOKEN: 2jhh99VgC54y-09ZKDiUWaH2H_EyvSv7puwOVu7o830=

      DB_NAME: blogdb
      DB_USER: bloguser
      DB_PASSWORD: blogpass
      DB_HOST: db
      DB_PORT: "5432"

      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_STORAGE_BUCKET_NAME: media
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_CUSTOM_DOMAIN: shakhes1.ir/media

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    command: celery -A config worker -l info

  celery_beat:
    build: .
    container_name: blog_celery_beat
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - minio
    environment:
      SECRET_KEY: django-production-secret
      DEBUG: "0"

      NERKH_API_TOKEN: 2jhh99VgC54y-09ZKDiUWaH2H_EyvSv7puwOVu7o830=

      DB_NAME: blogdb
      DB_USER: bloguser
      DB_PASSWORD: blogpass
      DB_HOST: db
      DB_PORT: "5432"

      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_STORAGE_BUCKET_NAME: media
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_CUSTOM_DOMAIN: shakhes1.ir/media

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    command: celery -A config beat -l info

volumes:
  postgres_data:
  minio_data:
